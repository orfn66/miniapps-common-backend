name: Validate App Platform
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_platform_test
