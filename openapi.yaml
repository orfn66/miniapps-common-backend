openapi: 3.1.0
info: {title: App Platform Feedback API, version: 1.0.0}
servers: [{url: https://platform.example.invalid/api/v1}]
paths:
  /auth/session:
    get:
      summary: Session humaine courante et jeton CSRF (même origine)
      responses: {'200': {description: Session valide}, '401': {description: Non connecté}}
  /auth/setup:
    post:
      security: [{bearerAuth: []}]
      summary: Activation unique e-mail/mot de passe (jeton admin complet uniquement)
      description: Origine HTTPS exacte obligatoire. JSON email et password (15 à 128 caractères). Émet un cookie HttpOnly sécurisé, jamais de mot de passe dans la réponse.
      responses: {'201': {description: Accès activé}, '400': {description: Entrée invalide}, '403': {description: Jeton admin ou origine refusés}, '409': {description: Accès déjà configuré}, '429': {description: Trop de tentatives}}
  /auth/login:
    post:
      summary: Connexion humaine avec e-mail et mot de passe
      description: Origine HTTPS exacte obligatoire. JSON email et password. Cookie HttpOnly de 12 heures et jeton CSRF dans la réponse.
      responses: {'200': {description: Connecté}, '401': {description: Identifiants invalides}, '403': {description: Origine refusée}, '429': {description: Trop de tentatives}}
  /auth/logout:
    post:
      summary: Révoque la session courante
      description: Cookie de session, origine exacte et en-tête X-CSRF-Token obligatoires.
      responses: {'200': {description: Déconnecté}, '403': {description: Origine ou CSRF refusé}}
  /auth/password:
    post:
      summary: Change le mot de passe et révoque toutes les anciennes sessions
      description: Cookie, origine exacte et X-CSRF-Token obligatoires. JSON current_password et password.
      responses: {'200': {description: Mot de passe changé et nouvelle session}, '400': {description: Nouveau mot de passe invalide}, '401': {description: Session ou mot de passe actuel invalides}, '403': {description: CSRF refusé}, '409': {description: Modification concurrente}, '429': {description: Trop de tentatives}}
  /apps:
    get: {summary: Liste des applications actives, responses: {'200': {description: OK}}}
  /installations:
    post:
      summary: Crée une installation pseudonyme
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InstallationInput'}}}}
      responses: {'201': {description: Jeton affiché une fois}, '404': {description: Application inconnue ou inactive}, '429': {description: Limité}}
  /feedback:
    post:
      security: [{bearerAuth: []}]
      summary: Crée un ticket
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackInput'}}}}
      responses: {'201': {description: Créé}, '400': {description: Entrée invalide}}
  /feedback/mine:
    get: {security: [{bearerAuth: []}], summary: Tickets de l’installation, responses: {'200': {description: OK}}}
  /feedback/{id}/attachments:
    post:
      security: [{bearerAuth: []}]
      summary: Ajoute une image privée au ticket propriétaire
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-Attachment-Consent, required: true, schema: {type: string, const: 'true'}}
      requestBody: {required: true, content: {image/jpeg: {}, image/png: {}, image/webp: {}}}
      responses: {'201': {description: Créée}, '413': {description: Plus de 5 Mio}, '415': {description: Format invalide}}
  /notifications/devices:
    post:
      security: [{bearerAuth: []}]
      summary: Inscrit ou renouvelle une capacité push dans l'application autorisée
      description: Scope notifications:devices:write. Références pseudonymisées côté serveur ; token/subscription chiffré et jamais retourné.
      responses: {'200': {description: Inscription active ou permission refusée}, '400': {description: Entrée ou application refusée}, '403': {description: Scope absent}}
  /notifications/devices/{id}:
    delete:
      security: [{bearerAuth: []}]
      summary: Révoque un appareil dans le périmètre applicatif du compte
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Désactivé}, '403': {description: Scope absent}, '404': {description: Hors périmètre ou inconnu}}
  /notifications/messages:
    post:
      security: [{bearerAuth: []}]
      summary: Met en file une notification décidée par l'application source
      description: Scope notifications:send, application autorisée et Idempotency-Key obligatoires. Le payload est borné puis chiffré ; aucune logique métier centrale.
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      responses: {'202': {description: Mise en file}, '200': {description: Rejeu idempotent}, '409': {description: Même clé avec contenu différent}}
  /admin/notifications:
    get:
      security: [{bearerAuth: []}, {humanSession: []}]
      summary: Livraisons techniques autorisées, sans contenu ni capacité
      responses: {'200': {description: 200 dernières notifications}, '403': {description: Scope notifications:read absent}}
  /admin/notifications/devices:
    get:
      security: [{bearerAuth: []}, {humanSession: []}]
      summary: Appareils techniques autorisés, sans token ni identité
      responses: {'200': {description: 200 derniers appareils}, '403': {description: Scope notifications:read absent}}
  /admin/apps:
    get: {security: [{bearerAuth: []}], summary: Registre autorisé (apps:read), responses: {'200': {description: OK}}}
    post: {security: [{bearerAuth: []}], summary: Enregistre une app (apps:write), responses: {'200': {description: Créée ou mise à jour}}}
  /admin/feedback:
    get:
      security: [{bearerAuth: []}, {humanSession: []}]
      summary: Liste filtrée (feedback:read)
      parameters:
        - {in: query, name: app_id, schema: {type: string}}
        - {in: query, name: type, schema: {$ref: '#/components/schemas/FeedbackType'}}
        - {in: query, name: status, schema: {$ref: '#/components/schemas/Status'}}
        - {in: query, name: priority, schema: {type: string}}
        - {in: query, name: chris_decision, schema: {$ref: '#/components/schemas/ChrisDecision'}}
        - {in: query, name: version, schema: {type: string}}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses:
        '200':
          description: Tickets autorisés ; champs de décision inclus, sans aucun envoi automatique.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: {type: array, items: {$ref: '#/components/schemas/DecisionFields'}}
  /admin/apps/{app_id}:
    patch:
      security: [{bearerAuth: []}]
      summary: Active ou archive une application (apps:write)
      parameters: [{in: path, name: app_id, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}, '404': {description: Application inconnue}}
  /admin/feedback/{id}:
    get:
      security: [{bearerAuth: []}, {humanSession: []}]
      summary: Détail (feedback:read), décision et historique inclus
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses:
        '200':
          description: Ticket autorisé ; historique des 50 dernières décisions et capacité humaine calculée côté serveur.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: {$ref: '#/components/schemas/DecisionFields'}
                  can_edit_decision: {type: boolean}
                  decision_history: {type: array, items: {type: object, description: 'actor, created_at et details contenant version/before/after'}}
    patch: {security: [{bearerAuth: []}], summary: Transition (feedback:write), parameters: [{$ref: '#/components/parameters/TicketId'}], responses: {'200': {description: OK}, '409': {description: Transition invalide}}}
  /admin/feedback/{id}/decision:
    patch:
      security: [{humanSession: []}]
      summary: Décision personnelle, session humaine autorisée uniquement
      description: Cookie valide avec feedback:read et feedback:write, app autorisée, origine HTTPS exacte et CSRF requis. Tous les Bearer sont refusés, même admin. Aucun changement de statut ni envoi. Contrôle optimiste expected_version ; une sauvegarde identique ne crée pas de version.
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chris_decision, decision_destination, decision_note, expected_version]
              properties:
                chris_decision: {$ref: '#/components/schemas/ChrisDecision'}
                decision_destination: {type: string, enum: [none, auto, chatgpt, codex], description: to_do accepte auto/chatgpt/codex ; to_discuss impose chatgpt ; les autres imposent none.}
                decision_note: {type: string, maxLength: 1000}
                expected_version: {type: integer, minimum: 0, maximum: 2147483646}
      responses:
        '200':
          description: Enregistré ou identique ; version et audit atomiques.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: {$ref: '#/components/schemas/DecisionFields'}
                  changed: {type: boolean}
        '400': {description: Valeurs ou association décision/destination invalides}
        '401': {description: Non authentifié}
        '403': {description: 'Session humaine, droits, origine ou CSRF refusés'}
        '404': {description: Ticket absent ou hors périmètre}
        '409': {description: decision_conflict — recharger la décision avant de réessayer}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    humanSession: {type: apiKey, in: cookie, name: __Host-app-platform-session}
  parameters: {TicketId: {in: path, name: id, required: true, schema: {type: string, format: uuid}}}
  schemas:
    ChrisDecision: {type: string, enum: [to_triage, to_do, to_discuss, not_needed]}
    DecisionFields:
      type: object
      description: Champs ajoutés aux réponses admin existantes ; les autres champs du ticket restent inchangés. Non exposés dans feedback/mine.
      properties:
        public_id: {type: string, format: uuid}
        chris_decision: {$ref: '#/components/schemas/ChrisDecision', default: to_triage}
        decision_destination: {type: string, enum: [none, auto, chatgpt, codex], default: none}
        decision_note: {type: string, maxLength: 1000, default: ''}
        decision_version: {type: integer, minimum: 0, default: 0}
        decision_updated_at: {type: [string, 'null'], format: date-time}
    InstallationInput: {type: object, required: [app_id, client_version], additionalProperties: false, properties: {app_id: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}, client_version: {type: string, maxLength: 64}}}
    FeedbackType: {type: string, enum: [bug, improvement, suggestion, review]}
    Status: {type: string, enum: [new, to_analyze, confirmed, in_progress, to_test, fixed, closed]}
    FeedbackInput:
      type: object
      required: [type, message]
      properties:
        type: {$ref: '#/components/schemas/FeedbackType'}
        title: {type: string, maxLength: 160}
        message: {type: string, minLength: 1, maxLength: 4000}
        priority: {type: string, enum: [low, normal, high, critical], default: normal}
        occurred_at: {type: string, format: date-time}
        route: {type: string, maxLength: 256}
        device: {type: string, maxLength: 160}
        os: {type: string, maxLength: 120}
        browser: {type: string, maxLength: 120}
        resolution: {type: string, maxLength: 32}
        user_reference: {type: string, maxLength: 160, description: Identifiant opaque propre à l’application, jamais un e-mail}
        technical_context: {type: object, maxProperties: 24, additionalProperties: true}
